
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Micro Stories | Jaiho Links</title>
    <meta name="description" content="Official links of AI Micro Stories. Micro Stories, Macro Imagination.">

    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body {
            background: #f7f6f2;
        }

        .links-page {
            width: min(100% - 32px, 620px);
            margin: 0 auto;
            padding: 35px 0 55px;
        }

        .links-top {
            margin-bottom: 35px;
        }

        .links-top a {
            color: #77736b;
            font-size: 13px;
            text-decoration: none;
        }

        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-logo {
            width: 76px;
            height: 76px;
            border-radius: 22px;
            background: #292821;
            color: white;
            display: grid;
            place-items: center;
            margin: 0 auto 16px;
            font-family: "Playfair Display", serif;
            font-size: 25px;
        }

        .profile h1 {
            font-size: clamp(27px, 6vw, 36px);
            margin: 0 0 7px;
            letter-spacing: -1.2px;
        }

        .profile p {
            color: #77736b;
            font-size: 13px;
            margin: 0 0 20px;
        }

        .profile-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .profile-actions a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 17px;
            border: 1px solid #e2dfd6;
            border-radius: 30px;
            color: #292821;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            background: white;
        }

        .profile-actions a:hover {
            background: #292821;
            color: white;
        }

        .brand-section {
            margin-top: 30px;
        }

        .brand-heading {
            font-size: 17px;
            margin: 0 0 12px;
            font-weight: 700;
        }

        .brand-links {
            display: grid;
            gap: 9px;
        }

        .brand-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            min-height: 53px;
            padding: 0 17px;
            background: #fff;
            border: 1px solid #e9e6de;
            border-radius: 12px;
            color: #292821;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: .2s ease;
        }

        .brand-link:hover {
            border-color: #c77a51;
            transform: translateY(-2px);
        }

        .brand-link span {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: #888277;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-link .external {
            width: 15px;
            height: 15px;
        }

        .profile-actions .icon {
            width: 16px;
            height: 16px;
        }

        .links-footer {
            text-align: center;
            margin-top: 45px;
            padding-top: 20px;
            border-top: 1px solid #e5e1d8;
            color: #888277;
            font-size: 11px;
        }

        .links-footer a {
            color: #292821;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .links-page {
                padding-top: 22px;
            }

            .links-top {
                margin-bottom: 28px;
            }

            .brand-link {
                min-height: 50px;
                padding: 0 13px;
            }

            .brand-section {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- INLINE SVG ICONS -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">

        <symbol id="icon-globe" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </symbol>

        <symbol id="icon-instagram" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
        </symbol>

        <symbol id="icon-youtube" viewBox="0 0 24 24">
            <path d="M22 12s0-4-1-5-4-1-9-1-8 0-9 1-1 5-1 5 0 4 1 5 4 1 9 1 8 0 9-1 1-5 1-5z"/>
            <path d="m10 8 6 4-6 4z"/>
        </symbol>

        <symbol id="icon-facebook" viewBox="0 0 24 24">
            <path d="M15 21v-8h3l.5-4H15V7c0-1.2.4-2 2-2h2V1.4A25 25 0 0 0 16 1c-3 0-5 1.8-5 5v3H8v4h3v8z"/>
        </symbol>

        <symbol id="icon-threads" viewBox="0 0 24 24">
            <path d="M12 21c-5.5 0-9-3.7-9-9s3.5-9 9-9c4.6 0 7.5 2.5 8.5 6.5"/>
            <path d="M12 21c3.5 0 6-2 6-5 0-2.5-1.8-4-4.5-4-2 0-3.5 1-3.5 2.8 0 1.5 1 2.2 2.5 2.2 2.8 0 4.5-2.5 4.5-6"/>
            <path d="M7 9c1-2 3-3 5-3 3 0 5 1.5 6 4"/>
        </symbol>

        <symbol id="icon-external" viewBox="0 0 24 24">
            <path d="M7 17 17 7"/>
            <path d="M7 7h10v10"/>
        </symbol>

    </svg>

    <main class="links-page">

        <div class="links-top">
            <a href="../index.html">← Back to Jaiho Links</a>
        </div>

        <!-- PRODUCT PROFILE -->
        <header class="profile">

            <div class="profile-logo">AMS</div>

            <h1>AI Micro Stories</h1>

            <p>Micro Stories, Macro Imagination.</p>

            <div class="profile-actions">

                <a href="https://aimicrostories.vercel.app/" target="_blank" rel="noopener noreferrer">
                    <svg class="icon"><use href="#icon-globe"/></svg>
                    Website
                </a>

                <a href="https://www.youtube.com/@aimicrostories" target="_blank" rel="noopener noreferrer">
                    <svg class="icon"><use href="#icon-youtube"/></svg>
                    YouTube
                </a>

            </div>
        </header>

        <!-- SOCIAL LINKS -->
        <section class="brand-section">

            <h2 class="brand-heading">Connect with us</h2>

            <div class="brand-links">

                <a class="brand-link" href="https://aimicrostories.vercel.app/" target="_blank" rel="noopener noreferrer">
                    <span>
                        <svg class="icon"><use href="#icon-globe"/></svg>
                        Website
                    </span>
                    <svg class="icon external"><use href="#icon-external"/></svg>
                </a>

                <a class="brand-link" href="https://www.instagram.com/aimicrostories" target="_blank" rel="noopener noreferrer">
                    <span>
                        <svg class="icon"><use href="#icon-instagram"/></svg>
                        Instagram
                    </span>
                    <svg class="icon external"><use href="#icon-external"/></svg>
                </a>

                <a class="brand-link" href="https://www.youtube.com/@aimicrostories" target="_blank" rel="noopener noreferrer">
                    <span>
                        <svg class="icon"><use href="#icon-youtube"/></svg>
                        YouTube
                    </span>
                    <svg class="icon external"><use href="#icon-external"/></svg>
                </a>

                <a class="brand-link" href="https://www.threads.com/@aimicrostories" target="_blank" rel="noopener noreferrer">
                    <span>
                        <svg class="icon"><use href="#icon-threads"/></svg>
                        Threads
                    </span>
                    <svg class="icon external"><use href="#icon-external"/></svg>
                </a>

                <a class="brand-link" href="https://www.facebook.com/people/AI-Micro-Stories/61588365518687/" target="_blank" rel="noopener noreferrer">
                    <span>
                        <svg class="icon"><use href="#icon-facebook"/></svg>
                        Facebook
                    </span>
                    <svg class="icon external"><use href="#icon-external"/></svg>
                </a>

            </div>
        </section>

        <footer class="links-footer">
            Part of <a href="../index.html">Jaiho Links</a>
            · Developed by Jaiho TechServe
        </footer>

    </main>

</body>
</html>
